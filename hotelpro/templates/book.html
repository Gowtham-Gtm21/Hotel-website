{% extends 'base.html' %}
{% load static %}

{% block content %}

<style>
    .book-section{
        min-height: 52vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 80px;
    }
</style>

<section class="book-section layout-padding">
    <div class="container">
        <div class="heading-container">
            <h2>Book A Table</h2>
        </div>
        <div class="row">
            <div class="col-md-6">
                <div class="form-container">
                    <form action="{% url 'book' %}" method="POST">
                        {% csrf_token %}
                        <div>
                            <input type="text" class="form-control" name="user-name" required placeholder="Your Name">
                        </div>
                        <div>
                            <input type="text" class="form-control" name="phone-number" required placeholder="Phone Number">
                        </div>
                        <div>
                            <input type="email" class="form-control" name="user-email" placeholder="Your Email">
                        </div>
                        <div>
                            <select class="form-control nice-select" required name="total-person">
                                <option value="" disabled selected>How many persons?</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                            </select>
                        </div>
                        <div>
                            <input type="text" class="form-control" name="booking-date" placeholder="Booking Date" onfocus="(this.type='date')" required>
                        </div>
                        <div class="btn-box">
                            <button>Book Now</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="col-md-6">
                <div class="map-container">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d99891.50926776032!2d2.316669173058534!3d48.859156644822974!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1sBurger%20King!5e0!3m2!1sen!2sin!4v1743340498435!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
        </div>
    </div>
</section>


{% endblock %}
